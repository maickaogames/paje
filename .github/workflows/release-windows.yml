name: Instalador Windows
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cargo tauri icon icons/icon.png
        working-directory: src-tauri
      - run: cargo tauri build
        working-directory: src-tauri
        env:
          PAJE_BUILD: ${{ github.run_number }}
      # Nome fixo para o botão "Baixar para Windows" sempre funcionar.
      - name: Renomear instalador
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName Paje-Setup.exe
      # Informa ao app instalado qual é a versão mais nova (usado em "Atualizar Pajé").
      - name: Gerar latest.json
        shell: pwsh
        run: |
          $tag = "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}"
          $json = @{ build = ${{ github.run_number }}; url = "https://github.com/maickaogames/paje/releases/download/$tag/Paje-Setup.exe" } | ConvertTo-Json -Compress
          Set-Content -Path latest.json -Value $json -Encoding utf8NoBOM
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: Pajé para Windows ${{ github.ref_name }} (${{ github.run_number }})
          make_latest: "true"
          files: |
            Paje-Setup.exe
            latest.json
      - uses: actions/upload-artifact@v4
        with:
          name: paje-windows
          path: Paje-Setup.exe
